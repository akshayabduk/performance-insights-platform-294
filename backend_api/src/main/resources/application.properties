spring.application.name=backendapi

# MongoDB Configuration - Values should be provided via environment variables.
# REQUIRED:
#  - MONGODB_URL: MongoDB connection string (e.g., mongodb://user:pass@host:port)
#  - MONGODB_DB: Database name
spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.database=${MONGODB_DB}

# JWT Configuration (values from environment)
# REQUIRED:
#  - JWT_SECRET: Base64-encoded secret for HS256 signing (min 256-bit recommended)
# OPTIONAL:
#  - JWT_EXPIRATION_MS: Token validity in milliseconds (default 1 day)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
